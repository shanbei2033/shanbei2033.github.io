<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">SB33 Tech Pages</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="wave-layer wave-1"></div>
    <div class="wave-layer wave-2"></div>
    <div class="wave-layer wave-3"></div>
    
    <button id="theme-toggle" class="theme-toggle" aria-label="切换主题">
        <svg id="sun-icon" class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg id="moon-icon" class="theme-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>

    <div class="container">
        <header>
            <h1 id="main-title">SB33 Tech Pages</h1>
            <p id="user-bio">Blogger | Vibe coding lover </p>
            <div class="hitokoto-wrapper">
                <p id="hitokoto-text">Loading...</p>
                <p id="hitokoto-from"></p>
            </div>
        </header>

        <section class="socials-section">
            <div class="socials-grid" id="socials-container">
                <!-- 社交链接将通过JavaScript动态生成 -->
            </div>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
